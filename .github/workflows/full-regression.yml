# The whole test suite (every simulator, every journey, stress and review tests). It takes much longer than the gate,
# so it runs before a release (started by hand) and once a week, not on every push. Publishes nothing.
name: Full regression

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    # GitHub-hosted runners (Linux and Windows alike) have no GPU, so WebGL runs on a software renderer that needs the
    # whole CPU: with 2 workers per runner the 3D suites starved each other and timed out (BUG-C01). Six shards, one
    # worker each: same tests, same assertions and timeouts, no CPU contention. Windows was tried (run 45402597982)
    # and timed out the same way, so it is not used.
    name: Full suite shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build and run every test (this shard)
        run: npm run test:full -- --shard=${{ matrix.shard }}/6 --workers=1
      # Before a release a flaky test is a finding: the job fails so that it is looked at, not retried away.
      - name: Test summary (flaky tests fail this run)
        if: always()
        run: node scripts/ci-summary.mjs --title="Full regression" --strict-flaky
      - name: Keep the report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-regression-${{ github.sha }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
