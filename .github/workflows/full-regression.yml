# The whole test suite (every simulator, every journey, stress and review tests). It takes much longer than the gate,
# so it runs before a release (started by hand) and once a week, not on every push. Publishes nothing.
name: Full regression

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    # CPU layer only (tests/layers.mjs). GitHub-hosted runners have no GPU, so the WebGL suites time out on a software
    # renderer (BUG-C01; runs 45402597982, 45434609356). Owner decision 2026-11-25: the GPU layer runs on a machine with a
    # real GPU before every release (`npm run test:gpu`, result recorded with the release).
    name: Full suite (CPU layer) shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build and run the CPU-layer tests (this shard)
        run: npm run test:cpu -- --shard=${{ matrix.shard }}/4
      # Before a release a flaky test is a finding: the job fails so that it is looked at, not retried away.
      - name: Test summary (flaky tests fail this run)
        if: always()
        run: node scripts/ci-summary.mjs --title="Full regression" --strict-flaky
      - name: Keep the report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-regression-${{ github.sha }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
