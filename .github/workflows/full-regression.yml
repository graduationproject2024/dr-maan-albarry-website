# The whole test suite (every simulator, every journey, stress and review tests). It takes much longer than the gate,
# so it runs before a release (started by hand) and once a week, not on every push. Publishes nothing.
name: Full regression

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    # Split into shards: one 2-hour job on a 4-core runner ran out of time and starved the software-rendered (SwiftShader)
    # 3D tests of CPU, which showed up as timeouts (BUG-C01). Linux and Windows both run: Windows routes WebGL through
    # ANGLE/Direct3D like the local suite, Linux keeps the SwiftShader path covered.
    name: Full suite ${{ matrix.os }} ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build and run every test (this shard)
        run: npm run test:full -- --shard=${{ matrix.shard }}/4
      # Before a release a flaky test is a finding: the job fails so that it is looked at, not retried away.
      - name: Test summary (flaky tests fail this run)
        if: always()
        run: node scripts/ci-summary.mjs --title="Full regression" --strict-flaky
      - name: Keep the report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-regression-${{ github.sha }}-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
