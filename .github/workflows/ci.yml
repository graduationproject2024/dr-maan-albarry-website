# Runs the quality gate on every branch push and pull request. Publishes nothing.
name: CI

on:
  push:
    branches-ignore: [ main ]   # main is verified by deploy.yml, in the same run that publishes it
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
