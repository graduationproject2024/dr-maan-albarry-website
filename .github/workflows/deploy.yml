name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The build prerenders / and /en/ in headless Chromium (scripts/prerender.mjs).
      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      # drmaanalbarry.com does not resolve yet (D-14), so canonical/hreflang/sitemap/robots point at the
      # GitHub Pages address. Change SITE_URL here once the production domain is live.
      - name: Build production bundle
        run: npm run build
        env:
          SITE_URL: https://graduationproject2024.github.io/dr-maan-albarry-website

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
