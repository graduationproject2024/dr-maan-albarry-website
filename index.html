  <script>
    // Pin <base> to the SITE ROOT before any relative URL loads, so assets and links resolve the same
    // at /, /en/, /<page>/, /en/<page>/, /procedures/<slug>/ and /en/procedures/<slug>/ — on a domain root or a
    // Pages subpath. Prerendered pages ship a static <base> (for no-JS readers); it is made absolute here so it
    // stays correct after client-side navigation changes the URL. The route pattern mirrors ROUTE_PATTERN in
    // site-routes.js (tests/phase1-pages.spec.js checks they agree).
    (function () {
      var b = document.querySelector('base');
      var m = location.pathname.match(/^(.*?\/)((?:en\/)?(?:(?:procedures\/[a-z0-9-]+|about|procedures|lens\-lab|surgical\-education|education|how\-vision\-works|clinic)\/?)?(?:index\.html)?)$/);
      if (b) {
        // A prerendered page names the route it was rendered for. Served at that URL, its relative <base> is right.
        // A host's SPA fallback may serve it at another depth (an unknown or mistyped URL): then derive the root
        // from the URL, or every script and stylesheet 404s and the page never starts (BUG-11).
        var r = document.querySelector('meta[name="site-route"]');
        var here = m ? m[2].replace(/index\.html$/, '') : null;
        if (!r || here === r.getAttribute('content')) { b.setAttribute('href', b.href); return; }
        b.setAttribute('href', m ? m[1] : '/');
        return;
      }
      b = document.createElement('base');
      b.setAttribute('href', m ? m[1] : '/');
      document.head.insertBefore(b, document.head.firstChild);
    })();
  </script>

  <script>
    (function(){
      // Resolved theme before first paint: a saved explicit choice wins, otherwise the device preference.
      var t = null;
      try { t = localStorage.getItem('theme'); } catch(e) {}
      if (t !== 'dark' && t !== 'light') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
