  - region "What Dr. Maan treats":
    - paragraph: Core specialties
    - heading "What Dr. Maan treats" [level=2]
    - paragraph: Three fields at the centre of his work. Each procedure has a plain-language guide to anatomy, steps, recovery and risks.
    - article:
      - img "Anatomical cross-section of the eye highlighting the natural lens behind the iris"
      - paragraph: Cataract & lens surgery
      - heading "Cataract surgery" [level=3]
      - paragraph: The clouded natural lens is removed and replaced with a clear artificial lens once blurred vision starts to affect daily life.
      - 'link "Read the guide : Cataract surgery"':
        - /url: en/procedures/cataract-surgery/
    - article:
      - img "Anatomical illustration of the cornea in section showing the area reshaped by laser"
      - paragraph: Vision correction
      - heading "Laser vision correction" [level=3]
      - paragraph: Reshaping the cornea with a laser (LASIK, surface PRK, SMILE) to reduce dependence on glasses or contact lenses.
      - 'link "Read the guide : Laser vision correction"':
        - /url: en/procedures/laser-vision-correction/
    - article:
      - img "Anatomical illustration of a cone-shaped cornea compared with a normal cornea"
      - paragraph: Cornea & retina care
      - heading "Keratoconus & corneal cross-linking (CXL)" [level=3]
      - paragraph: Diagnosing a thinning, bulging cornea, and cross-linking it with riboflavin drops and UV light to help slow progression.
      - 'link "Read the guide : Keratoconus & corneal cross-linking (CXL)"':
        - /url: en/procedures/keratoconus-cxl/
