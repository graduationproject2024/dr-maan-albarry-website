  - complementary "Seek urgent care for":
    - heading "Seek urgent care for" [level=3]
    - list:
      - listitem: Sudden loss or rapid worsening of vision in either eye.
      - listitem: Severe, sudden eye pain with redness, headache or nausea.
      - listitem: Sudden flashes of light or a shower of floating dark spots.
      - listitem: A dark shadow or curtain across part of your vision.
    - paragraph: Go to the nearest eye emergency department immediately.
  - 'heading "Before any procedure: the core assessments" [level=3]'
  - list "Assessments":
    - listitem:
      - heading "Corneal tomography" [level=4]
      - paragraph: Maps corneal shape and thickness — essential before laser and for diagnosing keratoconus.
    - listitem:
      - heading "Optical biometry" [level=4]
      - paragraph: Measures the eye’s length and corneal curve to calculate an implant’s power.
    - listitem:
      - heading "Retinal imaging (OCT)" [level=4]
      - paragraph: Cross-sectional images of the macula and retina for diagnosis and to guide injections.
    - listitem:
      - heading "Full eye examination" [level=4]
      - paragraph: Vision, eye pressure, slit-lamp and retina checks before any decision.
