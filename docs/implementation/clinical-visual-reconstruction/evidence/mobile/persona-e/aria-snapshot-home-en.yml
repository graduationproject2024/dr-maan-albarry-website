  - region "Worth knowing before your visit":
    - paragraph: Medical education
    - heading "Worth knowing before your visit" [level=2]
    - paragraph: Short guides in plain language, and answers to the questions patients ask most. General education that does not replace an examination.
    - article:
      - heading "What is a cataract, and when is surgery considered?" [level=3]:
        - link "What is a cataract, and when is surgery considered?":
          - /url: en/education/#cataract-guide
      - paragraph: A gradual, usually age-related clouding of the eye’s natural lens. Medicines do not clear it; surgery is discussed once blurred vision starts to affect daily life.
    - article:
      - 'heading "Keratoconus: symptoms, diagnosis and corneal cross-linking (CXL)" [level=3]':
        - 'link "Keratoconus: symptoms, diagnosis and corneal cross-linking (CXL)"':
          - /url: en/education/#keratoconus-guide
      - paragraph: A condition in which the cornea thins and bulges over time, often starting in young people. Early diagnosis opens the discussion about slowing it down.
    - article:
      - heading "Is laser vision correction right for me? (LASIK, Femto-LASIK, PRK)" [level=3]:
        - link "Is laser vision correction right for me? (LASIK, Femto-LASIK, PRK)":
          - /url: en/education/#lasik-candidacy
      - paragraph: The common safety criteria a doctor reviews before correcting short-sight, long-sight or astigmatism with a laser.
    - link "Education library & visit questionnaire":
      - /url: en/education/
    - 'link "Eye emergency: when to go now"':
      - /url: en/education/#red-flags
