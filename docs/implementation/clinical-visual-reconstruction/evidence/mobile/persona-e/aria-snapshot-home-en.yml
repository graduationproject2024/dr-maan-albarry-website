  - paragraph: Interactive 3D education
  - heading "Cataract surgery, step by step" [level=2]
  - paragraph: A 3D model of the eye that walks through the main stages of modern cataract removal and lens implantation — so you understand what happens before you ask about it in clinic.
  - list:
    - listitem: Illustrative education, pending physician review.
