  - article:
    - img "Anatomical cross-section of the eye highlighting the natural lens behind the iris"
    - paragraph: Cataract & lens surgery
    - heading "Cataract surgery" [level=3]
    - paragraph: The clouded natural lens is removed and replaced with a clear artificial lens once blurred vision starts to affect daily life.
    - paragraph: With a 3D walkthrough
    - 'link "Procedure details : Cataract surgery"':
      - /url: en/procedures/cataract-surgery/
  - article:
    - img "Anatomical illustration of an artificial lens implant sitting inside the eye’s lens capsule"
    - paragraph: Cataract & lens surgery
    - heading "Lens implants (IOLs)" [level=3]
    - paragraph: "The lenses placed during cataract surgery: monofocal, extended depth of focus, multifocal or trifocal, and toric for astigmatism."
    - 'link "Procedure details : Lens implants (IOLs)"':
      - /url: en/procedures/lens-implants/
  - article:
    - img "Anatomical illustration of the cornea in section showing the area reshaped by laser"
    - paragraph: Vision correction
    - heading "Laser vision correction" [level=3]
    - paragraph: Reshaping the cornea with a laser (LASIK, surface PRK, SMILE) to reduce dependence on glasses or contact lenses.
    - 'link "Procedure details : Laser vision correction"':
      - /url: en/procedures/laser-vision-correction/
  - article:
    - img "Anatomical illustration of an ICL positioned between the iris and the natural lens"
    - paragraph: Vision correction
    - heading "Implantable contact lens (ICL)" [level=3]
    - paragraph: A thin lens placed inside the eye while keeping the natural lens — an option for vision correction when laser is not suitable.
    - 'link "Procedure details : Implantable contact lens (ICL)"':
      - /url: en/procedures/icl/
  - article:
    - img "Anatomical illustration of a cone-shaped cornea compared with a normal cornea"
    - paragraph: Cornea & retina care
    - heading "Keratoconus & corneal cross-linking (CXL)" [level=3]
    - paragraph: Diagnosing a thinning, bulging cornea, and cross-linking it with riboflavin drops and UV light to help slow progression.
    - 'link "Procedure details : Keratoconus & corneal cross-linking (CXL)"':
      - /url: en/procedures/keratoconus-cxl/
  - article:
    - img "Anatomical illustration of the corneal layers showing the part replaced in a transplant"
    - paragraph: Cornea & retina care
    - heading "Corneal transplant (keratoplasty)" [level=3]
    - paragraph: Replacing all or part of a damaged cornea with donor corneal tissue when other treatments are not enough.
    - 'link "Procedure details : Corneal transplant (keratoplasty)"':
      - /url: en/procedures/corneal-transplant/
  - article:
    - img "Anatomical cross-section of the eye showing the vitreous, retina and macula"
    - paragraph: Cornea & retina care
    - heading "Intravitreal injections" [level=3]
    - paragraph: Medicine delivered directly inside the eye to treat retinal conditions such as wet macular degeneration and diabetic macular oedema.
    - 'link "Procedure details : Intravitreal injections"':
      - /url: en/procedures/intravitreal-injections/
